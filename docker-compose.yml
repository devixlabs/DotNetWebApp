services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-dev
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${SA_PASSWORD:-YourStrongPassword123!}'
    ports:
      - '1433:1433'
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: [CMD, /opt/mssql-tools18/bin/sqlcmd, -S, localhost, -U, sa, -P, '${SA_PASSWORD:-YourStrongPassword123!}', -C, -Q, 'SELECT 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dotnetwebapp-network

  dotnetwebapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnetwebapp
    environment:
      SA_PASSWORD: '${SA_PASSWORD:-YourStrongPassword123!}'
      ConnectionStrings__DefaultConnection: 'Server=sqlserver,1433;Database=GAI;User Id=sa;Password=${SA_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;'
      ConnectionStrings__PrimaryDatabase: 'Server=sqlserver,1433;Database=GAI;User Id=sa;Password=${SA_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;'
      ConnectionStrings__SecondaryDatabase: 'Server=sqlserver,1433;Database=GAIMisc;User Id=sa;Password=${SA_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;'
      ASPNETCORE_URLS: 'http://+:5210'
      ASPNETCORE_ENVIRONMENT: 'Docker'
      DOTNET_RUNNING_IN_CONTAINER: 'true'
    ports:
      - '7012:7012'
      - '5210:5210'
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dotnetwebapp-network
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local

networks:
  dotnetwebapp-network:
    driver: bridge
